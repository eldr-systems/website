# Ways to work with us. No prices on the site (PRODUCT.md): every engagement
# is quoted per project after a call.
- name: Feasibility and scoping
  line: Can it be built, how, and what will it cost. You get a written answer you keep, whether or not we build it.
- name: Prototype
  line: A working device reporting to a working dashboard, so you can test the idea in the field.
- name: Product development
  line: From prototype to small-series production, with the documentation to build more.
- name: Take over or extend
  line: One layer of an existing system, or a device someone else built that needs to work better.
