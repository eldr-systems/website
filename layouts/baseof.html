<!doctype html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>{{ partial "head.html" . }}</head>
<body class="bg-bone text-ink font-display">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 pill-ink">Skip to content</a>
  {{ partial "sprite.html" . }}
  <div class="mx-auto max-w-page">
    {{ partial "header.html" . }}
    <main id="main">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
  </div>
</body>
</html>
