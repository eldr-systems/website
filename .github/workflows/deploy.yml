name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep in step with mise.toml.
  HUGO_VERSION: 0.166.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo extended
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tailwind
        run: npm ci

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build and verify
        env:
          HUGO_ENVIRONMENT: production
          TZ: Europe/Budapest
        # check.sh builds the site itself and asserts on the output:
        # no broken placeholder links, no third-party asset requests,
        # the Archivo width axis survives, nav anchors resolve.
        run: ./scripts/check.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
