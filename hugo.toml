baseURL = 'https://eldrsystems.com/'
locale = 'en-GB'
defaultContentLanguage = 'en'
title = 'Eldr Systems'
enableRobotsTXT = true

# No tags or categories on this site.
[taxonomies]

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

# Hugo shells out to the Tailwind CLI; it must be whitelisted explicitly.
[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^npx$', '^postcss$', '^tailwindcss$']

# The Keep's live chart fetches a build-time snapshot with resources.GetRemote.
# Hugo's default maxAge for remote resources is -1 (cache forever), which would
# freeze the snapshot on a local machine; CI starts cold either way.
[caches]
  [caches.getresource]
    dir = ':cacheDir/:project'
    maxAge = '10m'

[module]
  # Declaring ANY mount for a target component replaces Hugo's defaults for
  # it. The 'static -> static' line below is the default, restated: without
  # it the fonts mount silently replaces it and nothing in static/ ships —
  # including CNAME, which would break the custom domain.
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'assets/fonts'
    target = 'static/fonts'
  [[module.mounts]]
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
    disableWatch = true

[languages]
  [languages.en]
    label = 'English'
    weight = 1
  [languages.hu]
    label = 'Magyar'
    weight = 2
    disabled = true

[params]
  description = 'Eldr Systems builds connected devices for industry end to end: electronics, firmware, connectivity, cloud and dashboards, by one team in Budapest.'
  ogDescription = 'From circuit board to dashboard. One team.'
  github = 'https://github.com/eldr-systems'

  # Unset on purpose. Anything empty renders as a disabled control,
  # never as a broken link. scripts/check.sh lists what is still empty.
  bookingUrl = ''
  email = ''
  linkedin = ''
  youtube = ''
  phone = '+36 30 123 1234'

  [params.company]
    legalName = 'Eldr Systems Kft.'
    seat = ''
    regNo = ''
    taxNo = ''
    vatNo = ''

  # The Keep's public endpoint (PRODUCT.md, "Live plot"). Devices are in real
  # homes: the chart shows them only by label, never by place.
  # The API answers CORS for eldrsystems.com only, so on localhost the chart
  # shows the build-time snapshot and says so.
  [params.keepLive]
    api = 'https://api.eldrsystems.com'
    days = 7
    [[params.keepLive.devices]]
      id = 'keep-0004'
      label = 'Device A'
    [[params.keepLive.devices]]
      id = 'keep-0005'
      label = 'Device B'
