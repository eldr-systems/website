<?xml version="1.0" encoding="UTF-8"?>
<!--
  Station 2: Modem (firmware). viewBox 0 0 240 180. Ports: modem-port-in (120,0), modem-port-out (120,180).
  Animatable IDs:
  modem-trace       path, measured current. Draw left to right: stroke-dasharray 1, stroke-dashoffset from 1 to 0 (pathLength is 1). If the dash misbehaves with non-scaling-stroke in a browser, drop vector-effect from this one path.
  modem-spike       path, Ember copy of the transmit spike, opacity 0. Raise to 1 while the drawing passes the spike (x 140 to 146), then fade back.
  modem-tx-label    text, fades opacity 0 to 1 during the spike.
  Static IDs: modem-sleep-current, modem-battery-v (value texts), modem-lead-in, modem-lead-out (trace stubs to the ports), modem-port-in, modem-port-out (r=0 markers).
  Colour variables carry brand fallbacks so the file also previews correctly on its own.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" aria-hidden="true" focusable="false" fill="none" stroke-width="1.5" font-family="var(--eldr-mono, 'IBM Plex Mono', monospace)" font-size="11" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Trace stubs to the ports -->
  <path id="modem-lead-in" stroke="currentColor" d="M120,0 V20" vector-effect="non-scaling-stroke"/>
  <path id="modem-lead-out" stroke="currentColor" d="M120,156 V180" vector-effect="non-scaling-stroke"/>

  <!-- Modem module: outline and castellated pads -->
  <g stroke="currentColor">
    <path d="M86,20 H160 V70 H80 V26 Z" vector-effect="non-scaling-stroke"/>
    <path d="M74,30 H80 M74,38 H80 M74,46 H80 M74,54 H80 M74,62 H80 M160,38 H166 M160,46 H166 M160,54 H166 M160,62 H166 M92,70 V76 M100,70 V76 M108,70 V76 M116,70 V76 M124,70 V76 M132,70 V76 M140,70 V76 M148,70 V76" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Shield can and antenna keep-out -->
  <g stroke="var(--eldr-slate, #5B6B7A)">
    <path d="M88,28 H152 V62 H88 Z" vector-effect="non-scaling-stroke"/>
    <rect x="172" y="16" width="40" height="28" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
  </g>
  <text x="120" y="49" text-anchor="middle" fill="var(--eldr-slate, #5B6B7A)">NB-IoT</text>

  <!-- Meander antenna -->
  <g stroke="currentColor">
    <path d="M160,30 H176 V22 H182 V38 H188 V22 H194 V38 H200 V22 H206" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Power profiler: axes and ticks -->
  <g stroke="var(--eldr-slate, #5B6B7A)">
    <path d="M24,92 V156 H216" vector-effect="non-scaling-stroke"/>
    <path d="M48,156 V159 M72,156 V159 M96,156 V159 M144,156 V159 M168,156 V159 M192,156 V159" vector-effect="non-scaling-stroke"/>
  </g>
  <text x="30" y="100" fill="var(--eldr-slate, #5B6B7A)">I</text>
  <text x="216" y="170" text-anchor="end" fill="var(--eldr-slate, #5B6B7A)">t</text>

  <!-- Current trace: sleep, paging, wake, transmit spike, tail, sleep, paging -->
  <path id="modem-trace" stroke="currentColor" pathLength="1" d="M24,152 H60 L64,148 H68 L72,152 H128 V138 H140 V98 H146 V138 H156 V146 H164 V152 H188 L192,148 H196 L200,152 H216" vector-effect="non-scaling-stroke"/>

  <!-- Transmit spike highlight, shown only during animation -->
  <path id="modem-spike" stroke="var(--eldr-ember, #E2632B)" d="M140,138 V98 H146 V138" opacity="0" vector-effect="non-scaling-stroke"/>

  <!-- Value labels -->
  <text id="modem-battery-v" x="68" y="66" text-anchor="end" fill="var(--eldr-slate, #5B6B7A)">[X.XX] V</text>
  <text id="modem-sleep-current" x="30" y="130" fill="var(--eldr-slate, #5B6B7A)">sleep · [X] µA</text>
  <text id="modem-tx-label" x="150" y="106" fill="var(--eldr-slate, #5B6B7A)" opacity="0">TX</text>

  <!-- Ports -->
  <circle id="modem-port-in" cx="120" cy="0" r="0"/>
  <circle id="modem-port-out" cx="120" cy="180" r="0"/>
</svg>
