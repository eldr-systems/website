<?xml version="1.0" encoding="UTF-8"?>
<!--
  Station 4: Backend (cloud). viewBox 0 0 240 200. Ports: backend-port-in (120,0), backend-port-out (120,200).
  Animatable IDs:
  backend-packet       path, packet in the centre queue slot. Can slide right to the last slot (x +48) before it drops to the workers.
  backend-worker-1     path, left worker. stroke is currentColor: set color to the Ember variable while it holds the packet.
  backend-worker-2     path, centre worker. Same; the suggested dot route uses this worker.
  backend-worker-3     path, right worker. Same.
  backend-raw-bytes    text, fades opacity 1 to 0 as the fields appear.
  backend-fields       g, parsed name value pairs, opacity 0. Fades in.
  backend-row-new      g, new table row at its final position, opacity 0. Slide in from translateY(12px) while fading to 1.
  backend-dot-path     path, never drawn (stroke none). Suggested dot route: port-in, queue, bus, worker 2, table, port-out.
  Static IDs: backend-col-t, backend-col-1, backend-col-2 (column headers), backend-field-1-name, backend-field-1-value, backend-field-2-name, backend-field-2-value (field texts), backend-lead-in, backend-lead-out (trace stubs), backend-port-in, backend-port-out (r=0 markers).
  Colour variables carry brand fallbacks so the file also previews correctly on its own.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" aria-hidden="true" focusable="false" fill="none" stroke-width="1.5" font-family="var(--eldr-mono, 'IBM Plex Mono', monospace)" font-size="11" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Trace stubs to the ports -->
  <path id="backend-lead-in" stroke="currentColor" d="M120,0 V10" vector-effect="non-scaling-stroke"/>
  <path id="backend-lead-out" stroke="currentColor" d="M120,182 V200" vector-effect="non-scaling-stroke"/>

  <!-- 1. Queue: five slots -->
  <g stroke="var(--eldr-slate, #5B6B7A)">
    <path d="M84,10 V30 M108,10 V30 M132,10 V30 M156,10 V30" vector-effect="non-scaling-stroke"/>
  </g>
  <g stroke="currentColor">
    <path d="M60,10 H180 V30 H60 Z" vector-effect="non-scaling-stroke"/>
  </g>
  <path id="backend-packet" stroke="currentColor" d="M115,15 H127 V25 H113 V17 Z" vector-effect="non-scaling-stroke"/>
  <text id="backend-raw-bytes" x="8" y="44" fill="var(--eldr-slate, #5B6B7A)">[0C 8A 01 F4 00 D5]</text>

  <!-- Queue exit and bus to the workers -->
  <g stroke="currentColor">
    <path d="M168,30 V44 L176,52 V60 M64,60 V52 H176 M120,52 V60" vector-effect="non-scaling-stroke"/>
  </g>
  <g fill="currentColor">
    <circle cx="120" cy="52" r="2"/>
    <circle cx="176" cy="52" r="2"/>
  </g>

  <!-- 2. Workers -->
  <path id="backend-worker-1" stroke="currentColor" d="M48,60 H84 V82 H44 V64 Z" vector-effect="non-scaling-stroke"/>
  <path id="backend-worker-2" stroke="currentColor" d="M104,60 H140 V82 H100 V64 Z" vector-effect="non-scaling-stroke"/>
  <path id="backend-worker-3" stroke="currentColor" d="M160,60 H196 V82 H156 V64 Z" vector-effect="non-scaling-stroke"/>

  <!-- Workers merge into the table -->
  <g stroke="currentColor">
    <path d="M64,82 V88 H176 V82 M120,82 V88 M120,88 V112" vector-effect="non-scaling-stroke"/>
  </g>
  <g fill="currentColor">
    <circle cx="120" cy="88" r="2"/>
  </g>

  <!-- Parsed fields, either side of the trace -->
  <g id="backend-fields" fill="var(--eldr-slate, #5B6B7A)" opacity="0">
    <text x="112" y="104" text-anchor="end"><tspan id="backend-field-1-name">[field]</tspan> <tspan id="backend-field-1-value">[value]</tspan></text>
    <text x="128" y="104"><tspan id="backend-field-2-name">[field]</tspan> <tspan id="backend-field-2-value">[value]</tspan></text>
  </g>

  <!-- 3. Table: header and three data rows -->
  <g stroke="var(--eldr-slate, #5B6B7A)">
    <path d="M30,140 H210 M30,154 H210 M90,112 V168 M150,112 V168" vector-effect="non-scaling-stroke"/>
    <path d="M36,133 H70 M96,133 H124 M156,133 H190 M36,147 H70 M96,147 H132 M156,147 H178 M36,161 H70 M96,161 H118 M156,161 H186" vector-effect="non-scaling-stroke"/>
  </g>
  <g stroke="currentColor">
    <path d="M30,112 H210 V168 H30 Z M30,126 H210" vector-effect="non-scaling-stroke"/>
  </g>
  <g fill="var(--eldr-slate, #5B6B7A)">
    <text id="backend-col-t" x="36" y="123">[t]</text>
    <text id="backend-col-1" x="96" y="123">[field]</text>
    <text id="backend-col-2" x="156" y="123">[field]</text>
  </g>

  <!-- New row, final position directly under the table -->
  <g id="backend-row-new" opacity="0">
    <path stroke="currentColor" d="M30,168 H210 V182 H30 Z" vector-effect="non-scaling-stroke"/>
    <path stroke="var(--eldr-slate, #5B6B7A)" d="M90,168 V182 M150,168 V182 M36,175 H70 M96,175 H112 M156,175 H184" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Suggested dot route, never drawn -->
  <path id="backend-dot-path" stroke="none" d="M120,0 V20 H168 V44 L176,52 H120 V200"/>

  <!-- Ports -->
  <circle id="backend-port-in" cx="120" cy="0" r="0"/>
  <circle id="backend-port-out" cx="120" cy="200" r="0"/>
</svg>
