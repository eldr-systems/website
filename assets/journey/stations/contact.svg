<?xml version="1.0" encoding="UTF-8"?>
<!--
  Station 7: Contact (your device next). viewBox 0 0 240 180. Port: contact-port-in (0,90), left centre. No port-out.
  Board outline is Station 1 scaled by 0.6, centred on the port.
  Animatable IDs:
  contact-outline         path, dashed Slate board outline, starting at the entry point (28,90) and running clockwise. It is shown through a mask so its dash pattern survives the draw-in.
  contact-outline-reveal  path inside contact-outline-mask, pathLength 1. Animate its stroke-dashoffset from 1 to 0 to draw the outline in from the entry point. Its white stroke is mask luminance, not a visible colour.
  contact-pads            g, mounting holes, edge pad and unconnected pads. Fade opacity 0 to 1 after the outline completes.
  Static IDs: contact-outline-mask, contact-lead-in (stub from the port to the board edge), contact-port-in (r=0 marker).
  Resting state is fully drawn: set the reveal dashoffset to 1 and contact-pads opacity to 0 before the animation starts.
  Colour variables carry brand fallbacks so the file also previews correctly on its own.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" aria-hidden="true" focusable="false" fill="none" stroke-width="1.5" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <mask id="contact-outline-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="180">
      <path id="contact-outline-reveal" stroke="white" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" d="M28,90 V33.6 L35.2,26.4 H212.8 L220,33.6 V146.4 L212.8,153.6 H35.2 L28,146.4 Z"/>
    </mask>
  </defs>

  <!-- Trace stub from the port to the board edge -->
  <path id="contact-lead-in" stroke="currentColor" d="M0,90 H28" vector-effect="non-scaling-stroke"/>

  <!-- Dashed board outline, revealed through the mask -->
  <path id="contact-outline" stroke="var(--eldr-slate, #5B6B7A)" stroke-dasharray="4 3" mask="url(#contact-outline-mask)" d="M28,90 V33.6 L35.2,26.4 H212.8 L220,33.6 V146.4 L212.8,153.6 H35.2 L28,146.4 Z" vector-effect="non-scaling-stroke"/>

  <!-- Mounting holes and unconnected pads -->
  <g id="contact-pads" stroke="var(--eldr-slate, #5B6B7A)">
    <circle cx="38.8" cy="37.2" r="2.7" vector-effect="non-scaling-stroke"/>
    <circle cx="209.2" cy="37.2" r="2.7" vector-effect="non-scaling-stroke"/>
    <circle cx="38.8" cy="142.8" r="2.7" vector-effect="non-scaling-stroke"/>
    <circle cx="209.2" cy="142.8" r="2.7" vector-effect="non-scaling-stroke"/>
    <rect x="34" y="87" width="8" height="6" vector-effect="non-scaling-stroke"/>
    <rect x="96" y="62" width="6" height="5" vector-effect="non-scaling-stroke"/>
    <rect x="108" y="62" width="6" height="5" vector-effect="non-scaling-stroke"/>
    <rect x="168" y="74" width="8" height="5" vector-effect="non-scaling-stroke"/>
    <rect x="168" y="84" width="8" height="5" vector-effect="non-scaling-stroke"/>
    <rect x="168" y="94" width="8" height="5" vector-effect="non-scaling-stroke"/>
    <rect x="168" y="104" width="8" height="5" vector-effect="non-scaling-stroke"/>
    <circle cx="100" cy="118" r="2.5" vector-effect="non-scaling-stroke"/>
    <circle cx="110" cy="118" r="2.5" vector-effect="non-scaling-stroke"/>
    <circle cx="120" cy="118" r="2.5" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Port -->
  <circle id="contact-port-in" cx="0" cy="90" r="0"/>
</svg>
