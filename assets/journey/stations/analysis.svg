<?xml version="1.0" encoding="UTF-8"?>
<!--
  Station 5: Analysis (data). viewBox 0 0 240 160. Ports: analysis-port-in (120,0), analysis-port-out (120,160).
  Animatable IDs:
  analysis-new-point    g, last line segment and new point at (204,68), opacity 0. Fade to 1 when the dot lands; color uses currentColor, so set color to the Ember variable briefly, then back.
  analysis-status-ok    g, check mark and "ok", opacity 0. Fades in after the point lands.
  analysis-status-flag  g, flag and "outside range", opacity 0. Alternative state, not used by default. Same position as the ok status; show one or the other.
  analysis-dot-path     path, never drawn (stroke none). Suggested dot route: port-in, down the now cursor to the new point, then out to port-out.
  Static IDs: analysis-band, analysis-band-label, analysis-cursor (dashed now marker), analysis-lead-in, analysis-lead-out (trace stubs), analysis-port-in, analysis-port-out (r=0 markers).
  Colour variables carry brand fallbacks so the file also previews correctly on its own.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" aria-hidden="true" focusable="false" fill="none" stroke-width="1.5" font-family="var(--eldr-mono, 'IBM Plex Mono', monospace)" font-size="11" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Normal range band -->
  <rect id="analysis-band" x="24" y="52" width="192" height="32" fill="var(--eldr-slate, #5B6B7A)" fill-opacity="0.15"/>
  <text id="analysis-band-label" x="30" y="98" fill="var(--eldr-slate, #5B6B7A)">normal range</text>

  <!-- Axes and now cursor -->
  <g stroke="var(--eldr-slate, #5B6B7A)">
    <path d="M24,32 V116 H216" vector-effect="non-scaling-stroke"/>
  </g>
  <path id="analysis-cursor" stroke="var(--eldr-slate, #5B6B7A)" stroke-dasharray="3 3" d="M204,32 V116" vector-effect="non-scaling-stroke"/>

  <!-- Trace stubs to the ports -->
  <path id="analysis-lead-in" stroke="currentColor" d="M120,0 V6 H196 L204,14 V32" vector-effect="non-scaling-stroke"/>
  <path id="analysis-lead-out" stroke="currentColor" d="M204,116 V124 L196,132 H128 L120,140 V160" vector-effect="non-scaling-stroke"/>

  <!-- Time series: 12 samples, one just outside the band -->
  <g stroke="currentColor">
    <path d="M36,70 L50,66 L64,72 L78,68 L92,62 L106,74 L120,70 L134,64 L148,88 L162,72 L176,68 L190,70" vector-effect="non-scaling-stroke"/>
  </g>
  <g fill="currentColor">
    <circle cx="36" cy="70" r="2"/>
    <circle cx="50" cy="66" r="2"/>
    <circle cx="64" cy="72" r="2"/>
    <circle cx="78" cy="68" r="2"/>
    <circle cx="92" cy="62" r="2"/>
    <circle cx="106" cy="74" r="2"/>
    <circle cx="120" cy="70" r="2"/>
    <circle cx="134" cy="64" r="2"/>
    <circle cx="148" cy="88" r="2"/>
    <circle cx="162" cy="72" r="2"/>
    <circle cx="176" cy="68" r="2"/>
    <circle cx="190" cy="70" r="2"/>
  </g>

  <!-- New point, on the now cursor -->
  <g id="analysis-new-point" opacity="0">
    <path stroke="currentColor" d="M190,70 L204,68" vector-effect="non-scaling-stroke"/>
    <circle cx="204" cy="68" r="2.5" fill="currentColor"/>
  </g>

  <!-- Status: ok (default) -->
  <g id="analysis-status-ok" opacity="0">
    <path stroke="currentColor" d="M28,20 L32,24 L40,16" vector-effect="non-scaling-stroke"/>
    <text x="46" y="24" fill="var(--eldr-slate, #5B6B7A)">ok</text>
  </g>

  <!-- Status: outside range (alternative) -->
  <g id="analysis-status-flag" opacity="0">
    <path stroke="var(--eldr-ember, #E2632B)" d="M30,26 V12 H40 L36,16 L40,20 H30" vector-effect="non-scaling-stroke"/>
    <text x="46" y="24" fill="var(--eldr-slate, #5B6B7A)">outside range</text>
  </g>

  <!-- Suggested dot route, never drawn -->
  <path id="analysis-dot-path" stroke="none" d="M120,0 V6 H196 L204,14 V124 L196,132 H128 L120,140 V160"/>

  <!-- Ports -->
  <circle id="analysis-port-in" cx="120" cy="0" r="0"/>
  <circle id="analysis-port-out" cx="120" cy="160" r="0"/>
</svg>
