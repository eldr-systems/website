<?xml version="1.0" encoding="UTF-8"?>
<!--
  Station 3: Tower (connectivity). viewBox 0 0 240 180.
  Ports: tower-port-in (120,0), not attached to any wire. tower-port-out (120,180), end of the backhaul.
  Animatable IDs:
  tower-rx-arcs          g holding three arcs, each at opacity 0. Show them one after another, outer to inner, as the signal arrives from the upper left.
  tower-rx-arc-outer     path, first arc to appear.
  tower-rx-arc-mid       path, second arc.
  tower-rx-arc-inner     path, third arc.
  tower-antenna-active   path, receiving panel, stroke is currentColor. Set color to the Ember variable briefly after the inner arc, then back.
  tower-psm              g, PSM timer block, opacity 0. Fades in after the arcs.
  tower-dot-path         path, never drawn (stroke none). Suggested dot route: port-in, through the arcs into the active panel, down the mast, along the backhaul to port-out.
  Static IDs: tower-tech, tower-psm-req-t3412, tower-psm-req-t3324, tower-psm-grant-t3412, tower-psm-grant-t3324 (texts), tower-backhaul, tower-port-in, tower-port-out (r=0 markers).
  Colour variables carry brand fallbacks so the file also previews correctly on its own.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" aria-hidden="true" focusable="false" fill="none" stroke-width="1.5" font-family="var(--eldr-mono, 'IBM Plex Mono', monospace)" font-size="11" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Mast: lattice bracing, then legs and top bar -->
  <g stroke="var(--eldr-slate, #5B6B7A)">
    <path d="M150,20 L162,32 L150,44 L162,56 L150,68 L162,80 L150,92 L162,104 L150,116 L162,128" vector-effect="non-scaling-stroke"/>
  </g>
  <g stroke="currentColor">
    <path d="M150,20 V128 M162,20 V128 M150,20 H162" vector-effect="non-scaling-stroke"/>
    <path d="M136,32 H150 M136,52 H150 M162,32 H176 M162,52 H176" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Panel antennas: right panel static, left panel receives -->
  <g stroke="currentColor">
    <path d="M178,24 H182 L184,26 V58 L182,60 H178 L176,58 V26 Z" vector-effect="non-scaling-stroke"/>
  </g>
  <path id="tower-antenna-active" stroke="currentColor" d="M130,24 H134 L136,26 V58 L134,60 H130 L128,58 V26 Z" vector-effect="non-scaling-stroke"/>
  <text id="tower-tech" x="190" y="46" fill="var(--eldr-slate, #5B6B7A)">NB-IoT</text>

  <!-- Incoming signal arcs, centred on the active panel face (128,42) -->
  <g id="tower-rx-arcs" stroke="currentColor">
    <path id="tower-rx-arc-outer" d="M102.9,35.3 A26,26 0 0 1 121.3,16.9" opacity="0" vector-effect="non-scaling-stroke"/>
    <path id="tower-rx-arc-mid" d="M110.6,37.3 A18,18 0 0 1 123.3,24.6" opacity="0" vector-effect="non-scaling-stroke"/>
    <path id="tower-rx-arc-inner" d="M118.3,39.4 A10,10 0 0 1 125.4,32.3" opacity="0" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Base and backhaul to port-out -->
  <g stroke="currentColor">
    <path d="M140,128 H172 L176,132 V136 H136 V132 Z" vector-effect="non-scaling-stroke"/>
  </g>
  <path id="tower-backhaul" stroke="currentColor" d="M156,136 V144 L120,180" vector-effect="non-scaling-stroke"/>

  <!-- PSM timers: requested by the device, granted by the network -->
  <g id="tower-psm" fill="var(--eldr-slate, #5B6B7A)" opacity="0">
    <text x="8" y="88">PSM requested</text>
    <text x="8" y="101"><tspan id="tower-psm-req-t3412">[T3412]</tspan> / <tspan id="tower-psm-req-t3324">[T3324]</tspan></text>
    <text x="8" y="119">granted</text>
    <text x="8" y="132"><tspan id="tower-psm-grant-t3412">[T3412]</tspan> / <tspan id="tower-psm-grant-t3324">[T3324]</tspan></text>
  </g>

  <!-- Suggested dot route, never drawn -->
  <path id="tower-dot-path" stroke="none" d="M120,0 V34 L128,42 H150 L156,48 V144 L120,180"/>

  <!-- Ports -->
  <circle id="tower-port-in" cx="120" cy="0" r="0"/>
  <circle id="tower-port-out" cx="120" cy="180" r="0"/>
</svg>
