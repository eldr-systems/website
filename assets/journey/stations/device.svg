<?xml version="1.0" encoding="UTF-8"?>
<!--
  Station 1: Device (hero). viewBox 0 0 400 300. Only port: device-port-out (200,300).
  Animatable IDs:
  device-sensor     g, sensor package and aperture, stroke inherits currentColor. Flash: set color to the Ember variable for about 300 ms, then back.
  device-reading    text, sensor value. Fades opacity 0 to 1 just after the sensor flash.
  device-trace-out  path, sensor to MCU to modem to port-out. The dot travels its length (getPointAtLength or offset-path). It has three subpaths; the zero-length movetos make the dot pass under the MCU and the modem.
  device-antenna    g, meander antenna, optional. Set color to the Ember variable briefly as the dot leaves the modem (transmit).
  Static IDs: device-battery-v (battery voltage text), device-port-out (r=0 marker where the page trace connects).
  Colour variables carry brand fallbacks so the file also previews correctly on its own.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-hidden="true" focusable="false" fill="none" stroke-width="1.5" font-family="var(--eldr-mono, 'IBM Plex Mono', monospace)" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Board outline -->
  <g stroke="currentColor">
    <path d="M52,28 H348 L360,40 V228 L348,240 H52 L40,228 V40 Z" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Mounting holes, antenna keep-out, secondary traces, passives, SWD pads -->
  <g stroke="var(--eldr-slate, #5B6B7A)">
    <circle cx="58" cy="46" r="4.5" vector-effect="non-scaling-stroke"/>
    <circle cx="342" cy="46" r="4.5" vector-effect="non-scaling-stroke"/>
    <circle cx="58" cy="222" r="4.5" vector-effect="non-scaling-stroke"/>
    <circle cx="342" cy="222" r="4.5" vector-effect="non-scaling-stroke"/>
    <rect x="264" y="36" width="68" height="40" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
    <path d="M154,168 H170 L180,158" vector-effect="non-scaling-stroke"/>
    <path d="M234,128 H254" vector-effect="non-scaling-stroke"/>
    <rect x="82" y="100" width="10" height="6" vector-effect="non-scaling-stroke"/>
    <rect x="238" y="98" width="10" height="6" vector-effect="non-scaling-stroke"/>
    <rect x="300" y="172" width="10" height="6" vector-effect="non-scaling-stroke"/>
    <circle cx="304" cy="214" r="3" vector-effect="non-scaling-stroke"/>
    <circle cx="316" cy="214" r="3" vector-effect="non-scaling-stroke"/>
    <circle cx="328" cy="214" r="3" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Battery: holder and two cylindrical cells in series -->
  <g stroke="var(--eldr-slate, #5B6B7A)">
    <path d="M60,154 H148 L154,160 V208 L148,214 H60 L54,208 V160 Z" vector-effect="non-scaling-stroke"/>
    <path d="M124,171 H132 M128,167 V175 M72,197 H80 M76,193 V201" vector-effect="non-scaling-stroke"/>
  </g>
  <g stroke="currentColor">
    <rect x="60" y="160" width="80" height="22" rx="4" vector-effect="non-scaling-stroke"/>
    <rect x="140" y="167" width="4" height="8" rx="1" vector-effect="non-scaling-stroke"/>
    <rect x="64" y="186" width="80" height="22" rx="4" vector-effect="non-scaling-stroke"/>
    <rect x="60" y="193" width="4" height="8" rx="1" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Sensor: pads, then animatable package -->
  <g stroke="currentColor">
    <path d="M70,64 H76 M70,72 H76 M70,80 H76 M108,64 H114 M108,72 H114 M108,80 H114" vector-effect="non-scaling-stroke"/>
  </g>
  <g id="device-sensor" stroke="currentColor">
    <path d="M81,56 H108 V88 H76 V61 Z" vector-effect="non-scaling-stroke"/>
    <circle cx="92" cy="72" r="6" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- MCU -->
  <g stroke="currentColor">
    <path d="M178,96 H228 V152 H172 V102 Z" vector-effect="non-scaling-stroke"/>
    <path d="M166,104 H172 M166,112 H172 M166,120 H172 M166,128 H172 M166,136 H172 M166,144 H172 M228,104 H234 M228,112 H234 M228,120 H234 M228,128 H234 M228,136 H234 M228,144 H234 M180,90 V96 M188,90 V96 M196,90 V96 M204,90 V96 M212,90 V96 M220,90 V96 M180,152 V158 M188,152 V158 M196,152 V158 M204,152 V158 M212,152 V158 M220,152 V158" vector-effect="non-scaling-stroke"/>
  </g>
  <text x="200" y="128" text-anchor="middle" fill="var(--eldr-slate, #5B6B7A)">MCU</text>

  <!-- Cellular modem module with shield can -->
  <g stroke="currentColor">
    <path d="M264,88 H334 V160 H258 V94 Z" vector-effect="non-scaling-stroke"/>
    <path d="M254,104 H258 M254,112 H258 M254,120 H258 M254,128 H258 M254,136 H258 M254,144 H258 M268,160 V164 M276,160 V164 M284,160 V164 M292,160 V164 M300,160 V164 M308,160 V164 M316,160 V164 M324,160 V164" vector-effect="non-scaling-stroke"/>
  </g>
  <g stroke="var(--eldr-slate, #5B6B7A)">
    <path d="M268,98 H324 V150 H268 Z" vector-effect="non-scaling-stroke"/>
  </g>
  <text x="296" y="128" text-anchor="middle" fill="var(--eldr-slate, #5B6B7A)">NB-IoT</text>

  <!-- PCB meander antenna -->
  <g id="device-antenna" stroke="currentColor">
    <path d="M322,88 V44 H312 V68 H302 V44 H292 V68 H282 V44 H272" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Signal trace for the dot: sensor, MCU, modem, port-out -->
  <path id="device-trace-out" stroke="currentColor" d="M108,80 H132 L156,104 H172 M228,120 H258 M284,160 V180 L256,208 H216 L200,224 V300" vector-effect="non-scaling-stroke"/>

  <!-- Value labels -->
  <text id="device-battery-v" x="162" y="190" fill="var(--eldr-slate, #5B6B7A)">[X.XX] V</text>
  <text id="device-reading" x="76" y="46" fill="var(--eldr-slate, #5B6B7A)" opacity="0">[reading]</text>

  <!-- Port -->
  <circle id="device-port-out" cx="200" cy="300" r="0"/>
</svg>
